name: Build StreamPlay 4 IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Swift / project integrity
        run: |
          plutil -lint StreamPlay/Info.plist
          plutil -lint StreamPlay.xcodeproj/project.pbxproj
      - name: Build unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StreamPlay-v4-IPA
          path: dist/StreamPlay-unsigned.ipa
          if-no-files-found: error
